[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/start-test -> /.netlify/functions/start-test и т.д.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: все остальные пути отдают index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
